services:
  brup:
    build: .
    image: brup:latest
    container_name: brup
    restart: unless-stopped
    ports:
      # Which host interface each port is published on. BRUP_BIND covers all
      # three; BRUP_UI_BIND overrides just the UI, so you can keep the
      # unauthenticated interface on localhost while leaving the proxy
      # reachable from the LAN (a phone, another VM). See .env.example.
      - "${BRUP_UI_BIND:-${BRUP_BIND:-0.0.0.0}}:9080:9080"   # web UI + API
      - "${BRUP_BIND:-0.0.0.0}:9081:9081"                    # proxy listener
      - "${BRUP_BIND:-0.0.0.0}:9444:9444"                    # invisible HTTPS
    volumes:
      # Where BRUP keeps its state: the CA key and certificate, settings.json
      # and the SQLite database holding every project.
      #
      # BRUP_DATA takes either form:
      #   brup-data              a named Docker volume (the default)
      #   ./data                 a directory beside this file
      #   /srv/brup/data         an absolute path on the host
      #
      # Anything starting with / or . is a bind mount; anything else is treated
      # as a named volume. Set it in .env - see .env.example.
      - ${BRUP_DATA:-brup-data}:${BRUP_DATA_DIR:-/data}
    # Needed only for the VPN feature: bringing up a tunnel means creating a
    # network interface and routes inside the container.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      # Kept in step with the mount target above, so the two cannot disagree.
      BRUP_DATA_DIR: ${BRUP_DATA_DIR:-/data}
      BRUP_LOG_LEVEL: ${BRUP_LOG_LEVEL:-INFO}
    # The proxy needs to resolve and reach whatever you are testing. If your
    # target runs on the Docker host, use host.docker.internal:
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # Only used when BRUP_DATA is left at its default. Declaring it is harmless
  # when BRUP_DATA points at a host directory instead.
  brup-data:
